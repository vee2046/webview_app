<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- 自适应图标前景层：只有笔画，没有底色（底色由 @color/ic_launcher_background 提供）。
       Android 会把前景层裁到中间 ~66dp 的安全区，所以这里整体放大并把中心对到 54,54。 -->
  <g transform="translate(54,54) scale(2.3) translate(-24,-24)">
    <path d="M14 14 v20 h7 a7 7 0 0 0 0 -14 h-7 z" fill="none" stroke="#d9534f" stroke-width="2.6"
      stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M30 16 h8 M30 24 h7 M30 32 h8" fill="none" stroke="#3d6b8a" stroke-width="2.6"
      stroke-linecap="round"/>
  </g>
</svg>
